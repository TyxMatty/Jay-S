# The Windows installer (NSIS), built on a clean machine: on a version tag (v*) or by hand from the
# Actions tab. It is kept as the run's artifact; publishing the release stays a manual step (notes,
# checking the installer on a test PC), as in Jay-C. The hub finds the release by its tag and the
# `*_x64-setup.exe` asset (docs/ARQUITETURA.md, section 1).
name: Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The hub compares the tag with the installed version: a tag that isn't the app's version
      # would offer an update forever.
      - name: The tag is the app's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME, tauri.conf.json $version" }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: npm ci
      # tauri build: vite build, cargo build --release, then the NSIS installer.
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: Jay-S-installer-${{ github.ref_name }}
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
