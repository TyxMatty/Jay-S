# CI: the same tests as `npm test` and `cargo test` on a developer's PC, on every push to main and
# every pull request. Copied from Jay-C. Rust runs on Windows: the OCR and the job object are Windows code.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # An advisory can come out for a dependency nobody touched: the audits also run every Monday.
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  rust:
    name: Rust tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the "stable" branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            frontend/src-tauri
            crates/jay-study
      - run: npm ci
      # The app embeds the built frontend (tauri.conf.json frontendDist), so it must exist to compile.
      - run: npm run build -w frontend
      # The engine: readers, rules, data folder, Jay-AI downloads (the real-model test stays ignored).
      - name: Engine
        working-directory: crates/jay-study
        run: cargo test
      - name: App
        working-directory: frontend/src-tauri
        run: cargo test

  # What blocks a release besides the tests (docs/ARQUITETURA.md, section 7, item 10).
  audit:
    name: Audits (dependencies, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Reads package-lock.json: nothing is installed, so no package's code runs here.
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
      # shortcut: built from source on each run (~3 min, with the runner's own Rust); upgrade to a
      # cached binary if the wait starts to matter.
      - name: cargo audit (both lock files)
        run: |
          cargo install cargo-audit --locked
          cargo audit --file crates/jay-study/Cargo.lock
          cargo audit --file frontend/src-tauri/Cargo.lock
      # The release's own binary, by its SHA-256 (from its checksums file), not an Action.
      - name: Secrets in the git history (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
