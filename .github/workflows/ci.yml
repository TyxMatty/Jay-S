# CI: the same tests as `npm test` and `cargo test` on a developer's PC, on every push to main and
# every pull request. Copied from Jay-C. Rust runs on Windows: the registry reading is Windows code.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  rust:
    name: Rust tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: npm ci
      # The app embeds the built frontend (tauri.conf.json frontendDist), so it must exist to compile.
      - run: npm run build -w frontend
      # Without --ignored: the test that downloads Jay-C's real installer stays on developers' PCs.
      - name: App
        working-directory: frontend/src-tauri
        run: cargo test
