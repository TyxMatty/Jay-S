[package]
name = "jay-study"
version = "0.1.1"
description = "Jay-S's engine: reading materials, telling content from exams, storing a student's data, without Tauri"
authors = ["TyxMatty"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: a schema's fields reach llama-server in the order written here, and the model
# writes them in that order (sorted, the answer came before its question).
serde_json = { version = "1", features = ["preserve_order"] }
# Random ids and the llama-server key (the OS's random source).
getrandom = "0.3"
# PDF text: pure Rust, `unsafe` forbidden (Jay-E's spike S1); the 14 standard fonts and the CMaps
# embedded, so PDFs that don't embed theirs still read.
hayro = { version = "0.9", features = ["embed-fonts", "embed-cmaps"] }
# DOCX: only deflate, in Rust (like Jay-E).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
# Photos of notes and exams, decoded in Rust with limits before the OCR.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Jay-AI's downloads (pinned SHA-256) and its llama-server on 127.0.0.1; the same crates as Jay-H.
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"

# OCR that comes with Windows (Windows.Media.Ocr), as in Jay-E. The same windows version Tauri uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Security_Cryptography", "Foundation_Collections", "Storage_Streams", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# hayro is far too slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
