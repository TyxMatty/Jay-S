[package]
name = "jay-s"
version = "0.1.2"
description = "Jay-S — study app of the Jay line"
authors = ["TyxMatty"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-single-instance = "2"
# The open dialog, called from Rust (the page has no dialog permission).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jay-study = { path = "../../crates/jay-study" }
# The shared updater of the Jay line; bump together with the Jay-I `ref` in .github/workflows/installer.yml.
jay-i = { git = "https://github.com/TyxMatty/Jay-I", rev = "f4f9ef07c0cf49abd1f53d3caa00c69e5aa1c90a" }

[target.'cfg(windows)'.dependencies]
# The same versions Tauri uses: the taskbar icon (taskbar_icon.rs) and the WebView2 settings (main.rs).
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Smaller, leaner binaries (same as Jay-C).
codegen-units = 1
lto = true
opt-level = "s"
# Not "abort": a malformed file that makes a reader panic is caught (jay_study::extract) instead of
# closing the app, as in Jay-E.
panic = "unwind"
strip = true

# hayro reads far too slowly unoptimized: optimize the dependencies in `npm run dev` too.
[profile.dev.package."*"]
opt-level = 3
